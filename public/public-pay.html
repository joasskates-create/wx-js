<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>订单支付</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#f4f7fb}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef4ff 0,#f7f9fc 45%,#f4f7fb 100%)}
    .card{width:min(92vw,460px);margin:10vh auto 0;padding:28px 24px 26px;background:#fff;border:1px solid #e4eaf3;border-radius:20px;box-shadow:0 14px 40px rgba(28,55,92,.1)}
    .loading{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.loading-dots{display:flex;gap:8px;margin-bottom:22px}.loading-dots i{width:10px;height:10px;border-radius:50%;background:#2878f0;animation:blink 1.1s infinite ease-in-out}.loading-dots i:nth-child(2){animation-delay:.15s}.loading-dots i:nth-child(3){animation-delay:.3s}@keyframes blink{0%,80%,100%{opacity:.35;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
    .hidden{display:none!important}.eyebrow{font-size:12px;letter-spacing:.14em;color:#2878f0;font-weight:700}.title{margin:10px 0 4px;font-size:24px}.muted{color:#73809a}.amount{font-size:42px;font-weight:750;letter-spacing:.02em;margin:20px 0 22px}.summary{border:1px solid #e5ebf3;border-radius:14px;padding:4px 16px;margin:0 0 20px}.summary-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #eef1f6;font-size:14px}.summary-row:last-child{border-bottom:0}.summary-row span:first-child{color:#7b879b}.summary-row span:last-child{text-align:right;word-break:break-all}.button{display:block;width:100%;padding:14px 16px;border:0;border-radius:10px;background:#07c160;color:#fff;font-size:16px;font-weight:650;cursor:pointer}.button.secondary{background:#2878f0}.button:disabled{background:#aeb8c8;cursor:not-allowed}.qr{max-width:240px;width:70%;display:block;margin:22px auto 8px}.error{color:#b42318}.hint{min-height:24px;margin:14px 0 0;text-align:center;font-size:14px}.status{font-size:14px;margin-top:4px}.foot{margin-top:18px;text-align:center;font-size:12px;color:#9aa5b6}
  </style>
</head>
<body>
  <main class="card">
    <section id="loading-view" class="loading">
      <div class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 class="title">支付跳转中</h1>
      <p class="muted">请稍候，正在准备订单支付页面</p>
    </section>
    <section id="order-view" class="hidden">
      <div class="eyebrow">ORDER PAYMENT</div>
      <h1 class="title">订单支付</h1>
      <p id="description" class="muted">--</p>
      <div id="amount" class="amount">--</div>
      <div class="summary">
        <div class="summary-row"><span>商户订单号</span><span id="order-no">--</span></div>
        <div class="summary-row"><span>创建时间</span><span id="created-at">--</span></div>
        <div class="summary-row"><span>有效期至</span><span id="expire-at">--</span></div>
        <div class="summary-row"><span>订单状态</span><span id="status">--</span></div>
      </div>
      <button id="wechat-open" class="button secondary hidden" type="button">打开微信继续支付</button>
      <button id="copy-link" class="button hidden" type="button" style="margin-top:10px;background:#4b5563">复制预览页链接（到微信粘贴打开）</button>
      <button id="pay" class="button hidden" type="button">微信内支付</button>
      <img id="qr" class="qr" hidden alt="订单支付二维码">
      <p id="hint" class="hint muted"></p>
      <p class="foot">请勿重复支付，订单支付状态以后台回调为准</p>
    </section>
  </main>
  <script src="/public-pay.js?v=handoff-ticket-1"></script>
</body>
</html>
