services:
  wechat-pay:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DB_PATH: /app/data/payments.db
    volumes:
      - payment-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  payment-data:
